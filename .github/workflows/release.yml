name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: cable-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.release.prerelease }}
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.12'
      - name: Configure UI test display
        run: swift .github/scripts/configure-display.swift
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: ${{ steps.python.outputs.python-path }}
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TEMP: ${{ runner.temp }}/cable-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash Release/publish.sh
      - name: Remove signing material
        if: ${{ always() }}
        env:
          RELEASE_TEMP: ${{ runner.temp }}/cable-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          security delete-keychain "$RELEASE_TEMP/signing.keychain-db" >/dev/null 2>&1 || true
          rm -rf "$RELEASE_TEMP"
